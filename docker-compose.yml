version: '3.8'

networks:
  mrsauravsahu:
    name: mrsauravsahu

volumes:
  portfolio_node_modules:

services:
  # ── Blogs .NET API ─────────────────────────────────────────────
  blogs:
    networks:
      - mrsauravsahu
    build:
      context: .
      dockerfile: common/docker/dotnet-dev.dockerfile
    volumes:
      - ./apps/blogs:/app
      # Real data lives in apps/data-store/data (portfolio/static/store is a symlink there)
      - ./apps/data-store/data:/store/data:ro
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:80"
      ASPNETCORE_ENVIRONMENT: Development
      Files__BasePath: /store/data
      Blogs__Version: "0.1.0"
      Blogs__ContactEmail: mrsauravsahu@outlook.com
      Blogs__AppName: "@mrsauravsahu/blogs"
    entrypoint: >
      sh -c "dotnet watch run --project /app/src/mrsauravsahu.api"
    ports:
      # Also exposed on host so you can hit the API directly at localhost:30001
      - "30001:80"

  # ── Portfolio SvelteKit dev ─────────────────────────────────────
  portfolio:
    networks:
      - mrsauravsahu
    build:
      context: .
      dockerfile: common/docker/node-dev.dockerfile
      args:
        NODE_VERSION: "18.17.1"
    volumes:
      - ./apps/portfolio:/app
      - portfolio_node_modules:/app/node_modules
      # Mount data at a neutral path — entrypoint fixes the broken symlink at startup
      - ./apps/data-store/data:/app/static/store/data:ro
      - ./apps/data-store/photos:/app/static/photos:ro
    environment:
      # Server-side (SSR / prerender): reach blogs via Docker service name
      BLOGS_API_URL: "http://blogs"
      # Client-side (browser): reach blogs API via host port
      VITE_BLOGS_BASE_URL: "http://localhost:30001"
    entrypoint: >
      sh -c "npm ci &&
             npm run dev -- --host --port 80"
    ports:
      - "3000:80"
    depends_on:
      - blogs
