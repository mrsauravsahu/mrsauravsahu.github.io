networks:
  mrsauravsahu:
    name: mrsauravsahu

volumes:
  portfolio_node_modules:
  export_node_modules:

services:
  # ── Blogs .NET API ─────────────────────────────────────────────
  blogs:
    networks:
      - mrsauravsahu
    build:
      context: .
      dockerfile: common/docker/dotnet-dev.dockerfile
    volumes:
      - ./apps/blogs:/app
      - ./apps/data-store/data:/store/data:ro
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:80"
      ASPNETCORE_ENVIRONMENT: Development
      Files__BasePath: /store/data
      Blogs__Version: "0.1.0"
      Blogs__ContactEmail: mrsauravsahu@outlook.com
      Blogs__AppName: "@mrsauravsahu/blogs"
    entrypoint: >
      sh -c "dotnet watch run --project /app/src/mrsauravsahu.api"
    ports:
      # Also exposed on host so you can hit the API directly at localhost:30001
      - "30001:80"

  # ── Portfolio SvelteKit dev ─────────────────────────────────────
  portfolio:
    networks:
      - mrsauravsahu
    build:
      context: .
      dockerfile: common/docker/node-dev.dockerfile
      args:
        NODE_VERSION: "20.11.1"
    volumes:
      - ./apps/portfolio:/app
      - portfolio_node_modules:/app/node_modules
      - ./apps/data-store/photos:/app/static/photos:ro
    environment:
      BLOGS_API_URL: "http://blogs"
      VITE_BLOGS_BASE_URL: "http://localhost:30001"
    entrypoint: >
      sh -c "npm ci &&
             npm run dev -- --host --port 80"
    ports:
      - "3000:80"
    depends_on:
      - blogs

  # ── Static export for gh-pages deployment ──────────────────────
  # Run once with: docker compose run --rm export
  export:
    networks:
      - mrsauravsahu
    build:
      context: .
      dockerfile: common/docker/node-dev.dockerfile
      args:
        NODE_VERSION: "20.11.1"
    volumes:
      - ./apps/portfolio:/app
      - export_node_modules:/app/node_modules
      - ./apps/data-store/photos:/app/../../data-store/photos:ro
    environment:
      # Reach blogs API via the Docker service name during prerender
      BLOGS_API_URL: "http://blogs"
    entrypoint: >
      sh -c "npm ci && npm run export"
    depends_on:
      - blogs
    profiles:
      - export
