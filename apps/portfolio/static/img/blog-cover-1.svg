<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan1" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="rgba(0,255,136,0.012)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#050505"/>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="250" rx="320" ry="180" fill="none" stroke="rgba(0,255,136,0.04)" stroke-width="80"/>

  <!-- Terminal window -->
  <rect x="80" y="62" width="640" height="376" fill="#080808" stroke="#1a2a1a" stroke-width="1"/>

  <!-- Terminal bar -->
  <rect x="80" y="62" width="640" height="34" fill="#0d0d0d"/>
  <line x1="80" y1="96" x2="720" y2="96" stroke="#1a2a1a" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="107" cy="79" r="5" fill="#ff5f57"/>
  <circle cx="127" cy="79" r="5" fill="#febc2e"/>
  <circle cx="147" cy="79" r="5" fill="#28c840"/>

  <!-- Title -->
  <text x="400" y="84" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#3d7a3d" letter-spacing="2">zsh</text>

  <!-- Line 1 -->
  <text x="108" y="130" font-family="'Courier New',monospace" font-size="13" fill="#00ff88" filter="url(#glow1)">$</text>
  <text x="122" y="130" font-family="'Courier New',monospace" font-size="13" fill="#3d7a3d"> cat writing.md</text>

  <!-- Big name output -->
  <text x="122" y="168" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="#b8ffb8" filter="url(#glow1)">writing on software</text>

  <!-- Fake body text bars -->
  <rect x="122" y="186" width="360" height="6" rx="2" fill="#1a2a1a"/>
  <rect x="122" y="200" width="440" height="6" rx="2" fill="#1a2a1a"/>
  <rect x="122" y="214" width="300" height="6" rx="2" fill="#1a2a1a"/>

  <!-- Second paragraph bars -->
  <rect x="122" y="238" width="420" height="6" rx="2" fill="#1a2a1a" opacity="0.6"/>
  <rect x="122" y="252" width="340" height="6" rx="2" fill="#1a2a1a" opacity="0.6"/>
  <rect x="122" y="266" width="460" height="6" rx="2" fill="#1a2a1a" opacity="0.6"/>
  <rect x="122" y="280" width="200" height="6" rx="2" fill="#1a2a1a" opacity="0.6"/>

  <!-- Second command -->
  <text x="108" y="320" font-family="'Courier New',monospace" font-size="13" fill="#00ff88" filter="url(#glow1)">$</text>
  <text x="122" y="320" font-family="'Courier New',monospace" font-size="13" fill="#3d7a3d"> ls -la posts/</text>

  <!-- File listing -->
  <text x="122" y="343" font-family="'Courier New',monospace" font-size="11" fill="#3d7a3d">drwxr-xr-x  </text>
  <text x="230" y="343" font-family="'Courier New',monospace" font-size="11" fill="#00ff88" filter="url(#glow1)">posts/</text>
  <text x="122" y="360" font-family="'Courier New',monospace" font-size="11" fill="#3d7a3d">-rw-r--r--  </text>
  <text x="230" y="360" font-family="'Courier New',monospace" font-size="11" fill="#b8ffb8">thoughts.md</text>
  <text x="122" y="377" font-family="'Courier New',monospace" font-size="11" fill="#3d7a3d">-rw-r--r--  </text>
  <text x="230" y="377" font-family="'Courier New',monospace" font-size="11" fill="#b8ffb8">shipping.md</text>
  <text x="122" y="394" font-family="'Courier New',monospace" font-size="11" fill="#3d7a3d">-rw-r--r--  </text>
  <text x="230" y="394" font-family="'Courier New',monospace" font-size="11" fill="#b8ffb8">craft.md</text>

  <!-- Cursor prompt -->
  <text x="108" y="422" font-family="'Courier New',monospace" font-size="13" fill="#00ff88" filter="url(#glow1)">$</text>
  <rect x="122" y="409" width="9" height="15" fill="#00ff88" opacity="0.85"/>

  <!-- Scanlines -->
  <rect width="800" height="500" fill="url(#scan1)" pointer-events="none"/>

  <!-- Corner accent lines -->
  <line x1="0" y1="0" x2="40" y2="0" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="0" x2="0" y2="40" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="500" x2="760" y2="500" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="500" x2="800" y2="460" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
</svg>
