<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeglow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan2" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="rgba(0,255,136,0.012)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#050505"/>

  <!-- Background grid dots -->
  <g opacity="0.12">
    <circle cx="80"  cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="160" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="240" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="320" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="400" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="480" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="560" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="640" cy="80"  r="1.5" fill="#3d7a3d"/>
    <circle cx="720" cy="80"  r="1.5" fill="#3d7a3d"/>

    <circle cx="80"  cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="160" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="240" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="320" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="400" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="480" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="560" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="640" cy="160" r="1.5" fill="#3d7a3d"/>
    <circle cx="720" cy="160" r="1.5" fill="#3d7a3d"/>

    <circle cx="80"  cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="160" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="240" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="320" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="400" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="480" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="560" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="640" cy="240" r="1.5" fill="#3d7a3d"/>
    <circle cx="720" cy="240" r="1.5" fill="#3d7a3d"/>

    <circle cx="80"  cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="160" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="240" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="320" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="400" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="480" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="560" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="640" cy="320" r="1.5" fill="#3d7a3d"/>
    <circle cx="720" cy="320" r="1.5" fill="#3d7a3d"/>

    <circle cx="80"  cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="160" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="240" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="320" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="400" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="480" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="560" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="640" cy="400" r="1.5" fill="#3d7a3d"/>
    <circle cx="720" cy="400" r="1.5" fill="#3d7a3d"/>
  </g>

  <!-- Network edges -->
  <g stroke="#1a2a1a" stroke-width="1" fill="none" opacity="0.8">
    <line x1="400" y1="250" x2="200" y2="140"/>
    <line x1="400" y1="250" x2="600" y2="140"/>
    <line x1="400" y1="250" x2="160" y2="310"/>
    <line x1="400" y1="250" x2="640" y2="310"/>
    <line x1="400" y1="250" x2="310" y2="380"/>
    <line x1="400" y1="250" x2="490" y2="380"/>
    <line x1="200" y1="140" x2="160" y2="310"/>
    <line x1="600" y1="140" x2="640" y2="310"/>
    <line x1="160" y1="310" x2="310" y2="380"/>
    <line x1="640" y1="310" x2="490" y2="380"/>
    <line x1="200" y1="140" x2="310" y2="80"/>
    <line x1="600" y1="140" x2="490" y2="80"/>
  </g>

  <!-- Accent edges (highlighted path) -->
  <g stroke="#00ff88" stroke-width="1" fill="none" opacity="0.25" filter="url(#glow2)">
    <line x1="400" y1="250" x2="200" y2="140"/>
    <line x1="400" y1="250" x2="640" y2="310"/>
    <line x1="200" y1="140" x2="310" y2="80"/>
  </g>

  <!-- Secondary nodes -->
  <g fill="#0a0a0a" stroke="#1a2a1a" stroke-width="1">
    <circle cx="310" cy="80"  r="10"/>
    <circle cx="490" cy="80"  r="10"/>
    <circle cx="160" cy="310" r="10"/>
    <circle cx="640" cy="310" r="10"/>
    <circle cx="310" cy="380" r="10"/>
    <circle cx="490" cy="380" r="10"/>
  </g>

  <!-- Secondary node dots -->
  <g fill="#3d7a3d">
    <circle cx="310" cy="80"  r="3"/>
    <circle cx="490" cy="80"  r="3"/>
    <circle cx="160" cy="310" r="3"/>
    <circle cx="640" cy="310" r="3"/>
    <circle cx="310" cy="380" r="3"/>
    <circle cx="490" cy="380" r="3"/>
  </g>

  <!-- Outer ring nodes -->
  <g fill="#0a0a0a" stroke="#3d7a3d" stroke-width="1">
    <circle cx="200" cy="140" r="14"/>
    <circle cx="600" cy="140" r="14"/>
  </g>
  <g fill="#3d7a3d">
    <circle cx="200" cy="140" r="5"/>
    <circle cx="600" cy="140" r="5"/>
  </g>

  <!-- Center node — main -->
  <circle cx="400" cy="250" r="28" fill="#050505" stroke="#00ff88" stroke-width="1.5" filter="url(#nodeglow)"/>
  <circle cx="400" cy="250" r="10" fill="#00ff88" opacity="0.9"/>

  <!-- Center label -->
  <text x="400" y="295" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#3d7a3d" letter-spacing="1">systems</text>

  <!-- Top-left label block -->
  <rect x="32" y="32" width="120" height="42" fill="#080808" stroke="#1a2a1a" stroke-width="1"/>
  <text x="42" y="50" font-family="'Courier New',monospace" font-size="9" fill="#00ff88">$ node</text>
  <text x="42" y="65" font-family="'Courier New',monospace" font-size="8" fill="#3d7a3d">v20.11.0</text>

  <!-- Bottom-right label block -->
  <rect x="648" y="426" width="120" height="42" fill="#080808" stroke="#1a2a1a" stroke-width="1"/>
  <text x="658" y="444" font-family="'Courier New',monospace" font-size="9" fill="#00ff88">$ uptime</text>
  <text x="658" y="459" font-family="'Courier New',monospace" font-size="8" fill="#3d7a3d">99.9%</text>

  <!-- Scanlines -->
  <rect width="800" height="500" fill="url(#scan2)" pointer-events="none"/>

  <!-- Corner accents -->
  <line x1="0" y1="0" x2="40" y2="0" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="0" x2="0" y2="40" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="500" x2="760" y2="500" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="500" x2="800" y2="460" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
</svg>
