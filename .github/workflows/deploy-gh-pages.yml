name: 'Deploy to GitHub Pages'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PROJECT_NAME: mrsauravsahu
  NAMESPACE: mrsauravsahu-dev
  K3D_CLUSTER_NAME: mrsauravsahu-ci
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup please.build
        uses: sagikazarmark/setup-please-action@v0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install GitVersion.Tool
        run: dotnet tool install --global GitVersion.Tool --version 5.12.0

      - name: Setup k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create ${{ env.K3D_CLUSTER_NAME }} \
            --agents 2 \
            --port "80:80@loadbalancer" \
            --port "443:443@loadbalancer" \
            --k3s-arg "--disable=traefik@server:0" \
            --wait

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.28.0

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} || true

      - name: Build and load images into k3d
        run: |
          set -euo pipefail

          # Debug: show Please version
          plz version

          # Build all service images using Please with CI tag
          # VERSION is required by genrule for docker_image tagging
          VERSION=${{ env.IMAGE_TAG }} PLZ_OVERRIDES=buildenv.DOCKER_TAG:${{ env.IMAGE_TAG }} plz run //apps/blogs:docker //apps/data-store:docker //apps/portfolio:docker

          # Verify images exist locally
          docker images mrsauravsahu/*:${{ env.IMAGE_TAG }}

          # Wait a bit for k3d to be fully ready
          sleep 5

          # Load images into k3d (image names from .plzconfig: default-docker-repo = mrsauravsahu)
          k3d image import -c ${{ env.K3D_CLUSTER_NAME }} \
            mrsauravsahu/blogs:${{ env.IMAGE_TAG }} \
            mrsauravsahu/data-store:${{ env.IMAGE_TAG }} \
            mrsauravsahu/portfolio:${{ env.IMAGE_TAG }}

          # Verify loaded
          k3d image list -c ${{ env.K3D_CLUSTER_NAME }} | grep mrsauravsahu

      - name: Generate Helm manifests with CI values
        run: |
          # Generate manifests using production values.yaml (not local)
          for svc in blogs data-store portfolio; do
            plz run //apps/${svc}:helm_tarball
            mkdir -p plz-out/gen/apps/${svc}/ci_k8s
            tar xzf plz-out/gen/apps/${svc}/${svc}.tgz -C plz-out/gen/apps/${svc}/ci_k8s
          done

      - name: Deploy stack to k3d
        run: |
          # Override image tags to use CI images
          for svc in blogs data-store portfolio; do
            helm upgrade --install ${svc} \
              plz-out/gen/apps/${svc}/ci_k8s/${svc} \
              -n ${{ env.NAMESPACE }} \
              --create-namespace \
              --set image.tag=${{ env.IMAGE_TAG }} \
              --set image.repository=mrsauravsahu/${svc} \
              --set image.pullPolicy=IfNotPresent \
              --set podVolumes= \
              --set podVolumeMounts= \
              --wait --timeout=300s
          done

      - name: Wait for deployments to be ready
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deploy/blogs deploy/data-store deploy/portfolio \
            -n ${{ env.NAMESPACE }}

      - name: Build static site in portfolio pod
        run: |
          cd apps/portfolio
          BUILD_DIR="build-$(date +%s)"
          ./build-site.sh "$BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_OUTPUT
        id: build

      - name: Deploy to GitHub Pages
        if: always()
        run: |
          cd apps/portfolio
          ./deploy.sh "${{ steps.build.outputs.BUILD_DIR }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup k3d
        if: always()
        run: |
          k3d cluster delete ${{ env.K3D_CLUSTER_NAME }}